name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela o run anterior, que ja esta obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, lint e testes
    runs-on: ubuntu-latest

    # Postgres real para validar as migrations. As suites de teste continuam
    # mockando repositorios e o cliente R2, mas migration e DDL: um SQL
    # invalido ou incompativel com dado existente nao aparece em teste
    # mockado, so na hora do `migrate deploy`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # src/config/env.ts valida as variaveis obrigatorias no momento do import,
    # e os specs importam esse modulo, entao a suite nem carrega sem elas.
    # DATABASE_URL aponta para o servico acima e e usada de verdade pelo passo
    # de migrations; as R2_* seguem sendo placeholders, porque o cliente R2 e
    # mockado nos testes.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-placeholder-not-a-real-secret
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem do campo packageManager do package.json da raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile faz o run falhar se o lockfile estiver dessincronizado
      # do package.json, em vez de resolver silenciosamente outra arvore.
      #
      # O postinstall do back-end roda prisma generate aqui: sem isso o
      # @prisma/client fica no estado de stub e o build quebra com dezenas
      # de TS2305/TS2339.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Turbo resolve a ordem entre os workspaces: shared -> back-end -> front-end.
      - name: Build
        run: pnpm build

      # lint:ci, e nao lint: o script `lint` do repo roda com --fix, que em CI
      # corrigiria o problema em silencio em vez de reprovar o PR.
      - name: Lint
        run: pnpm lint:ci

      # O `build` roda `nest build`, que usa tsconfig.build.json e exclui
      # **/*spec.ts -- ou seja, erro de tipo em teste nao reprovava o PR. Foi
      # assim que um `import` sem @types chegou na main. Este passo usa o
      # tsconfig.json completo, que cobre src/ e test/.
      - name: Typecheck
        run: pnpm typecheck

      # Aplica o historico inteiro num banco vazio. Pega SQL invalido, ordem
      # de migration quebrada e schema fora de sincronia -- nenhum deles
      # visivel para as suites mockadas.
      - name: Migrations
        run: pnpm --dir back-end prisma:migrate:deploy

      # De graca, valida tambem o seed, que e passo obrigatorio do onboarding.
      - name: Seed
        run: pnpm --dir back-end prisma:seed

      - name: Testes unitarios
        run: pnpm test

      - name: Testes e2e
        run: pnpm test:e2e

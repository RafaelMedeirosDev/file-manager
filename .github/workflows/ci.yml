name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela o run anterior, que ja esta obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, lint e testes
    runs-on: ubuntu-latest

    # src/config/env.ts valida as variaveis obrigatorias no momento do import,
    # e os specs importam esse modulo, entao a suite nem carrega sem elas.
    # Os valores abaixo sao placeholders sem efeito algum: os testes mockam os
    # repositorios e o cliente R2, nao abrindo conexao com banco nem bucket.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-placeholder-not-a-real-secret
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder
      R2_PUBLIC_URL: https://example.invalid

    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem do campo packageManager do package.json da raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile faz o run falhar se o lockfile estiver dessincronizado
      # do package.json, em vez de resolver silenciosamente outra arvore.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Turbo resolve a ordem entre os workspaces: shared -> back-end -> front-end.
      - name: Build
        run: pnpm build

      # lint:ci, e nao lint: o script `lint` do repo roda com --fix, que em CI
      # corrigiria o problema em silencio em vez de reprovar o PR.
      - name: Lint
        run: pnpm lint:ci

      - name: Testes unitarios
        run: pnpm test

      - name: Testes e2e
        run: pnpm test:e2e
